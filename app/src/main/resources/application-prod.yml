spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.boilerplate.springboot: INFO

management:
  endpoint:
    health:
      show-details: never
