<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} + ' · Boilerplate'">User · Boilerplate</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{layout/fragments :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{layout/fragments :: topbar}"></header>
    <main class="content">
      <section class="panel">
        <form th:object="${userForm}"
              th:action="${userId == null} ? @{/admin/users} : @{/admin/users/{id}(id=${userId})}"
              method="post"
              class="form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <p class="flash err" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

          <label th:if="${userId == null}">
            Email
            <input type="email" th:field="*{email}" required maxlength="255"/>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
          </label>
          <label th:if="${userId != null}">
            Email
            <input type="email" th:field="*{email}" readonly/>
          </label>

          <label>
            Display name
            <input type="text" th:field="*{displayName}" maxlength="200"/>
          </label>

          <label>
            Password <span th:if="${userId != null}" class="muted">(leave blank to keep)</span>
            <input type="password" th:field="*{password}" th:required="${userId == null}" minlength="6" maxlength="100"/>
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
          </label>

          <label class="checkbox" th:if="${userId != null}">
            <input type="checkbox" th:field="*{enabled}"/>
            Enabled
          </label>

          <fieldset>
            <legend>Roles</legend>
            <label class="checkbox" th:each="role : ${allRoles}">
              <input type="checkbox" th:field="*{roleNames}" th:value="${role.name}"/>
              <span th:text="${role.name}">ADMIN</span>
              <span class="muted" th:text="' — ' + ${role.description}"></span>
            </label>
            <span class="field-error" th:if="${#fields.hasErrors('roleNames')}" th:errors="*{roleNames}"></span>
          </fieldset>

          <div class="actions">
            <button type="submit">Save</button>
            <a class="ghost-link" th:href="@{/admin/users}">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
</body>
</html>
