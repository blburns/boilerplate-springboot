<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Items — Spring Boot Boilerplate</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<main class="page">
  <header class="header">
    <p class="brand">Boilerplate</p>
    <h1>Items</h1>
    <p class="lede">Sample CRUD surface for the multi-module Spring Boot base.</p>
  </header>

  <p class="flash ok" th:if="${message}" th:text="${message}"></p>
  <p class="flash err" th:if="${error}" th:text="${error}"></p>

  <section class="panel">
    <h2>Create item</h2>
    <form th:action="@{/items}" th:object="${itemForm}" method="post" class="form">
      <label>
        Name
        <input type="text" th:field="*{name}" maxlength="200" required/>
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </label>
      <label>
        Description
        <textarea th:field="*{description}" maxlength="2000" rows="3"></textarea>
        <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
      </label>
      <button type="submit">Add item</button>
    </form>
  </section>

  <section class="panel">
    <h2>All items</h2>
    <p th:if="${#lists.isEmpty(items)}" class="empty">No items yet.</p>
    <table th:if="${!#lists.isEmpty(items)}">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.name}">Name</td>
        <td th:text="${item.description}">Desc</td>
        <td>
          <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post">
            <button type="submit" class="danger">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </section>

  <footer class="footer">
    <a href="/swagger-ui.html">API docs</a>
    ·
    <a href="/actuator/health">Health</a>
  </footer>
</main>
</body>
</html>
