<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="sidebar">
  <div class="brand-block">
    <p class="brand">Boilerplate</p>
    <p class="brand-sub">Admin</p>
  </div>
  <nav class="nav" th:with="uri=${currentUri}">
    <a th:href="@{/admin}"
       th:classappend="${uri == '/admin' or uri == '/admin/'} ? ' active'">Dashboard</a>
    <a sec:authorize="hasAuthority('items:read')" th:href="@{/items}"
       th:classappend="${uri != null and #strings.startsWith(uri, '/items')} ? ' active'">Items</a>
    <a sec:authorize="hasAuthority('users:read')" th:href="@{/admin/users}"
       th:classappend="${uri != null and #strings.startsWith(uri, '/admin/users')} ? ' active'">Users</a>
    <a sec:authorize="hasAuthority('roles:read')" th:href="@{/admin/roles}"
       th:classappend="${uri != null and #strings.startsWith(uri, '/admin/roles')} ? ' active'">Roles</a>
  </nav>
</aside>

<header th:fragment="topbar" class="topbar">
  <div>
    <h1 class="page-title" th:text="${pageTitle} ?: 'Admin'">Admin</h1>
  </div>
  <div class="topbar-actions">
    <span class="user-chip" sec:authentication="name">user</span>
    <form th:action="@{/logout}" method="post" class="inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="ghost">Sign out</button>
    </form>
  </div>
</header>
</body>
</html>
